allowedDeprecatedVersions:
  glob: 10.5.0

minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1440
shamefullyHoist: true
shellEmulator: true

overrides:
  oxc-parser: '>=0.140.0'
  vite: ^8.3.4

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true

updateConfig:
  ignoreDependencies:
    - typescript
